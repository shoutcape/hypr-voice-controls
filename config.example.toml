# voice-controls configuration
# Copy to ~/.config/voice-controls/config.toml and edit as needed.
# All values shown are the defaults. You only need to set what you want to change.
# Tilde (~) is expanded to your home directory in path fields.

# ── Speech-to-text model ─────────────────────────────────────────

# Path to the GGML whisper model file.
# The default model is distil-large-v3: a distilled English-only model that
# is ~6x faster than whisper large-v3 while performing within 1% WER.
# Download it with: make model
#
# Both English-only (.en) and multilingual GGML models are supported.
# Multilingual models have English forced automatically at inference time.
model_path = "~/.local/share/voice-controls/models/ggml-distil-large-v3.bin"

# Compute device: "cpu" or "cuda"
# CUDA requires building with: make build-cuda
device = "cpu"

# ── Audio capture ────────────────────────────────────────────────

# PortAudio input device name.
# "default" uses the system default microphone.
# Any other value is matched by substring against PortAudio device names.
# To list available PortAudio device names:
#   ./build/audio-smoke -list-devices   (once that flag is added)
# For now, PortAudio device names can be inspected via:
#   python3 -c "import sounddevice; print(sounddevice.query_devices())"
# Note: PortAudio device names differ from pactl source names.
audio_source = "default"

# Maximum recording duration in seconds.
# Recording automatically stops after this many seconds as a safety cap.
max_record_secs = 120

# ── Text output ──────────────────────────────────────────────────

# Shortcut sent via `hyprctl dispatch sendshortcut` to paste clipboard contents.
# Format: "MODIFIERS,KEY,"  (trailing comma is required by hyprctl)
paste_shortcut = "CTRL SHIFT,V,"

# ── Daemon ───────────────────────────────────────────────────────

# Unix socket path for IPC between the client and daemon.
# Defaults to $XDG_RUNTIME_DIR/voice-controls.sock
# socket_path = "~/.local/state/voice-controls.sock"

# Log level: "debug", "info", "warn", "error"
log_level = "info"
