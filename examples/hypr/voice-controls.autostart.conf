# Hyprland autostart for voice-controls daemon.
# Source this file from your hyprland.conf:
#   source = ~/.config/hypr/voice-controls.autostart.conf

# Propagate Wayland environment to systemd so the service can access
# the display, clipboard, and notification stack.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Start (or restart) the voice-controls service.
exec-once = systemctl --user restart voice-controls.service
