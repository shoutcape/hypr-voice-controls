# Hyprland autostart for voxtype plus the optional wakeword bridge.
# Source this file from your hyprland.conf:
#   source = ~/.config/hypr/voxtype.autostart.conf

# Make the graphical-session environment available to user services.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Start voxtype itself.
exec-once = systemctl --user restart voxtype.service

# Optional: uncomment if you installed the wakeword bridge.
# exec-once = systemctl --user restart voice-controls-wakeword-bridge.service
